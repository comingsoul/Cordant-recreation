<script>
/* =====================================================================
   1) 설정

const CONFIG = {
  SUPABASE_URL: "https://lewiipqawxuzkpdlnlvv.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_FP6oITe8CQ03he_kSTz0Fw_ICUtGnZ9",
  ADMIN_PIN: "991111",    // 관리자 페이지 접속 PIN — 원하는 숫자로 바꾸세요

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const $ = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = n=>String(n).padStart(2,"0");
const initial = n=>String(n||"?").trim().slice(-2);
const GENDER = {M:"남",F:"여",X:"-"};

const DEFAULT_QUESTIONS = [
  {id:"q1",label:"요즘 가장 자주 듣는 노래는?",placeholder:"가수 - 제목",type:"text"},
  {id:"q2",label:"인생 음식 딱 하나만 고른다면?",placeholder:"예) 엄마표 김치찌개",type:"text"},

  {id:"q5",label:"최근에 가장 크게 웃었던 순간은?",placeholder:"짧게 적어주세요",type:"textarea"},
];

async function sb(path, opt={}){
  const key = CONFIG.SUPABASE_ANON_KEY;
  const send = withAuth => fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+path,{
    method:opt.method||"GET",
    headers:{apikey:key,...(withAuth?{Authorization:"Bearer "+key}:{}),
      "Content-Type":"application/json",...(opt.prefer?{Prefer:opt.prefer}:{})},
    body:opt.body?JSON.stringify(opt.body):undefined});
  // 구형 anon 키(JWT)와 신형 publishable 키 양쪽 모두 지원
  let res = await send(true);
  if(res.status===401) res = await send(false);
  const text = await res.text();
  if(!res.ok) throw new Error("서버 오류 ("+res.status+") "+text.slice(0,240));
  return text?JSON.parse(text):null;
}

/* =====================================================================
   2) 데모 데이터
   ===================================================================== */
const DEMO_DB = (()=>{
  const A=(name,y,g,mbti,ls,a,i)=>({id:"a-"+name,name,phone4:"1234",birth_year:y,gender:g,mbti,leader_score:ls,
    answers:{q1:a[0],q2:a[1],q3:a[2],q4:a[3],q5:a[4]},submitted:true,
    submitted_at:new Date(Date.UTC(2026,8,1,1+i)).toISOString()});
  const people=[
    A("배현우",2000,"M","INTJ",3,["실리카겔 - 백역","마라탕","조용히 회사부터 그만둔다","계획형 인간","고양이가 문 여는 걸 배웠을 때"],0),
    A("서예린",1999,"F","ISTJ",2,["아이유 - 밤편지","평양냉면","부모님 집 사드리기","성실한 거북이","동생이 넘어지며 춤춘 날"],1),
    A("한소희",1998,"F","INFP",3,["검정치마 - 기다린 만큼","떡볶이","세계일주 티켓 예약","몽상가","친구 결혼식에서 축가 삑사리"],2),
    A("최유진",1997,"F","ESTJ",4,["뉴진스 - Ditto","엄마표 김치찌개","적금 통장 만들기","추진력 갑","팀 회식에서 부장님 성대모사"],3),
    A("박서연",1996,"F","ISFJ",3,["잔나비 - 주저하는 연인들을 위해","닭갈비","가족들 모아 발표","다정한 담요","강아지가 내 슬리퍼 물고 도망"],4),
    A("윤채원",1995,"F","ISTP",2,["새소년 - 난춘","초밥","일단 아무한테도 말 안 함","무심한 편","동료가 회의 중 커피 쏟았을 때"],5),
    A("김지훈",1994,"M","ENFP",5,["데이식스 - 예뻤어","곱창","친구들 다 불러서 파티","시끄러운 햇살","길에서 아는 사람 헛본 날"],6),
    A("이도윤",1993,"M","INTP",2,["라디오헤드 - Creep","라멘","세금부터 계산한다","분석하는 사람","AI가 내 이름 틀리게 부를 때"],7),
    A("강하늘",1992,"M","ENTJ",5,["임영웅 - 사랑은 늘 도망가","삼겹살","사업 계획서 작성","돌직구","조카가 나를 이모라 불렀을 때"],8),
    A("정민서",1991,"F","INFJ",3,["아이브 - LOVE DIVE","월남쌈","조용한 시골집 알아보기","깊은 우물","친구 잠꼬대 녹음 들었을 때"],9),
    A("임태호",1990,"M","ESFP",4,["싸이 - 챔피언","치킨","바로 퇴사 통보","분위기 메이커","노래방에서 마이크 부순 날"],10),
    A("오준혁",1989,"M","ENFJ",4,["폴킴 - 모든 날, 모든 순간","된장찌개","부모님 여행 보내드리기","맏형 스타일","팀원이 내 자리에 곰인형 앉혀둔 날"],11),
  ];
  people.push({id:"a-미제출",name:"신입생",phone4:"9999",birth_year:null,gender:null,mbti:null,
    leader_score:3,answers:{},submitted:false,submitted_at:null});
  return {
    settings:{id:1,event_title:"조 편성 & 조원 맞히기",form_open:true,reveal_at:null,
      teams_published:false,team_size:4,questions:DEFAULT_QUESTIONS},
    applicants:people, teams:[], team_members:[], guess_results:[],
  };
})();

/* =====================================================================
   3) 데이터 접근
   ===================================================================== */
const api = {
  async settings(){
    if(DEMO) return DEMO_DB.settings;
    const r = await sb("settings?id=eq.1&select=*"); const s=r&&r[0];
    if(!s) throw new Error("settings 행이 없습니다. schema.sql을 먼저 실행해주세요.");
    if(!Array.isArray(s.questions)||!s.questions.length) s.questions=DEFAULT_QUESTIONS;
    return s;
  },
  async saveSettings(patch){
    if(DEMO){Object.assign(DEMO_DB.settings,patch);return DEMO_DB.settings;}
    const r = await sb("settings?id=eq.1",{method:"PATCH",body:patch,prefer:"return=representation"});
    return r[0];
  },
  async applicants(){
    if(DEMO) return DEMO_DB.applicants.slice();
    return await sb("applicants?select=*&order=created_at.asc");
  },
  async patchApplicant(id,patch){
    if(DEMO){const a=DEMO_DB.applicants.find(x=>x.id===id);Object.assign(a,patch);return a;}
    const r = await sb("applicants?id=eq."+id,{method:"PATCH",body:patch,prefer:"return=representation"});
    return r[0];
  },
  async removeApplicant(id){
    if(DEMO){
      DEMO_DB.applicants=DEMO_DB.applicants.filter(a=>a.id!==id);
      DEMO_DB.team_members=DEMO_DB.team_members.filter(m=>m.applicant_id!==id);return;
    }
    await sb("applicants?id=eq."+id,{method:"DELETE"});
  },
  async teams(){
    if(DEMO) return {teams:DEMO_DB.teams.slice(),links:DEMO_DB.team_members.slice()};
    const teams = await sb("teams?select=*&order=no.asc");
    const links = teams.length ? await sb("team_members?select=team_id,applicant_id") : [];
    return {teams,links};
  },
  async replaceTeams(plan){
    if(DEMO){
      DEMO_DB.teams = plan.map((t,i)=>({id:"t"+(i+1),no:t.no,leader_id:t.leader?t.leader.id:null}));
      DEMO_DB.team_members = plan.flatMap((t,i)=>t.members.map(m=>({team_id:"t"+(i+1),applicant_id:m.id})));
      DEMO_DB.guess_results=[]; return;
    }
    await sb("teams?no=gte.0",{method:"DELETE"});
    const created = await sb("teams",{method:"POST",prefer:"return=representation",
      body:plan.map(t=>({no:t.no,leader_id:t.leader?t.leader.id:null}))});
    const rows=[];
    created.sort((a,b)=>a.no-b.no).forEach(row=>{
      const p = plan.find(x=>x.no===row.no);
      p.members.forEach(m=>rows.push({team_id:row.id,applicant_id:m.id}));
    });
    if(rows.length) await sb("team_members",{method:"POST",body:rows});
  },
  async setLeader(teamId,applicantId){
    if(DEMO){const t=DEMO_DB.teams.find(t=>t.id===teamId);t.leader_id=applicantId;return;}
    await sb("teams?id=eq."+teamId,{method:"PATCH",body:{leader_id:applicantId}});
  },
  async moveMember(applicantId,fromTeamId,toTeamId){
    if(DEMO){
      DEMO_DB.team_members=DEMO_DB.team_members.filter(m=>!(m.applicant_id===applicantId&&m.team_id===fromTeamId));
      DEMO_DB.team_members.push({team_id:toTeamId,applicant_id:applicantId});
      const from=DEMO_DB.teams.find(t=>t.id===fromTeamId);
      if(from&&from.leader_id===applicantId) from.leader_id=null;
      return;
    }
    await sb("team_members?applicant_id=eq."+applicantId+"&team_id=eq."+fromTeamId,{method:"DELETE"});
    await sb("team_members",{method:"POST",body:[{team_id:toTeamId,applicant_id:applicantId}]});
    const t = await sb("teams?select=id,leader_id&id=eq."+fromTeamId);
    if(t[0]&&t[0].leader_id===applicantId) await sb("teams?id=eq."+fromTeamId,{method:"PATCH",body:{leader_id:null}});
  },
  async results(){
    if(DEMO) return DEMO_DB.guess_results.slice();
    return await sb("guess_results?select=*");
  },
};

/* =====================================================================
   4) 조 편성 알고리즘
     · 4명씩 (인원에 따라 3~5명)
     · 각 조에 E 성향 최소 1명
     · 나이는 가깝게, 단 동갑은 같은 조에 두지 않음
     · 조장 = 조 안의 E 중 리더 성향 점수가 가장 높은 사람
   ===================================================================== */
const isE = p=>String(p.mbti||"").toUpperCase().startsWith("E");
const yearsOf = t=>t.members.map(m=>m.birth_year).filter(Boolean);
const avgYear = t=>{const y=yearsOf(t);return y.length?y.reduce((a,b)=>a+b,0)/y.length:0;};
const rnd = n=>Math.floor(Math.random()*n);

const W_SAME_AGE = 60;   // 동갑 페널티
const W_NO_E     = 500;  // E 없는 조 페널티

function teamCost(t){
  const y=yearsOf(t); if(!y.length) return 0;
  const spread=Math.max(...y)-Math.min(...y);
  const dup=y.length-new Set(y).size;
  return spread + dup*W_SAME_AGE + (t.members.some(isE)?0:W_NO_E);
}
const totalCost = ts=>ts.reduce((s,t)=>s+teamCost(t),0);

function addCost(t,p){
  const y=yearsOf(t);
  const avg=y.length?y.reduce((a,b)=>a+b,0)/y.length:(p.birth_year||0);
  let c=Math.abs((p.birth_year||avg)-avg);
  if(p.birth_year&&y.includes(p.birth_year)) c+=W_SAME_AGE;
  if(!t.members.some(isE)&&!isE(p)) c+=5;
  return c;
}

function buildTeams(people,size){
  const warnings=[];
  const n=people.length;
  if(n<2) return {teams:[],warnings:["제출을 마친 신청자가 2명 이상이어야 합니다."]};
  const want=size||4;
  let k=Math.max(1,Math.round(n/want));
  if(n/k>want) k=Math.max(1,Math.ceil(n/want));   // 한 조가 희망 인원을 넘지 않도록
  const sizes=new Array(k).fill(Math.floor(n/k));
  for(let i=0;i<n%k;i++) sizes[i]++;

  const byYoung=(a,b)=>(b.birth_year||0)-(a.birth_year||0);
  const Es=people.filter(isE).sort(byYoung);
  const rest=people.filter(p=>!isE(p)).sort(byYoung);
  if(Es.length<k) warnings.push(`E 성향이 ${Es.length}명뿐입니다. 조 ${k}개 전부에 E를 넣을 수 없어 일부 조는 리더 성향 점수가 가장 높은 사람이 조장이 됩니다.`);

  const teams=sizes.map((cap,i)=>({no:i+1,cap,members:[]}));
  Es.slice(0,k).forEach((p,i)=>teams[i].members.push(p));
  const pool=[...Es.slice(k),...rest].sort(byYoung);
  for(const p of pool){
    let best=null,bc=Infinity;
    for(const t of teams){
      if(t.members.length>=t.cap) continue;
      const c=addCost(t,p);
      if(c<bc){bc=c;best=t;}
    }
    (best||teams[0]).members.push(p);
  }

  // 지역 탐색: 두 사람을 바꿔보고 전체 비용이 줄면 유지
  let cur=totalCost(teams);
  for(let it=0;it<6000;it++){
    const i=rnd(teams.length),j=rnd(teams.length);
    if(i===j||!teams[i].members.length||!teams[j].members.length) continue;
    const a=rnd(teams[i].members.length),b=rnd(teams[j].members.length);
    const pa=teams[i].members[a],pb=teams[j].members[b];
    teams[i].members[a]=pb;teams[j].members[b]=pa;
    const next=totalCost(teams);
    if(next<cur) cur=next; else {teams[i].members[a]=pa;teams[j].members[b]=pb;}
  }

  teams.sort((x,y)=>avgYear(y)-avgYear(x));
  teams.forEach((t,i)=>{t.no=i+1;t.members.sort((a,b)=>(b.birth_year||0)-(a.birth_year||0));});
  teams.forEach(t=>{
    const cands=t.members.filter(isE);
    const pool2=(cands.length?cands:t.members).slice().sort((a,b)=>
      (b.leader_score||0)-(a.leader_score||0) || String(a.submitted_at||"").localeCompare(String(b.submitted_at||"")));
    t.leader=pool2[0]||null;
    if(!cands.length&&t.leader) warnings.push(`${t.no}조에는 E 성향이 없어 ${t.leader.name}님(리더 성향 ${t.leader.leader_score})을 조장으로 지정했습니다.`);
    const y=yearsOf(t);
    const dups=[...new Set(y.filter((v,i)=>y.indexOf(v)!==i))];
    if(dups.length) warnings.push(`${t.no}조에 ${dups.join(", ")}년생이 겹칩니다. 인원 구성상 불가피한 경우입니다.`);
  });
  return {teams,warnings};
}

function toast(msg,kind="ok"){
  const el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  if(kind==="bad"){el.style.background="var(--bad)";el.style.color="#fff";}
  document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}

function viewRank(){
  const best=new Map();
  for(const r of A.results.filter(r=>r.cleared)){
    const c=best.get(r.leader_id);
    if(!c||r.attempts<c.attempts||(r.attempts===c.attempts&&(r.duration_ms??1e9)<(c.duration_ms??1e9))) best.set(r.leader_id,r);
  }
  const rows=Array.from(best.values()).sort((a,b)=>a.attempts-b.attempts||(a.duration_ms??1e9)-(b.duration_ms??1e9));
  const tno=id=>{const t=A.teams.find(t=>t.id===id);return t?t.no+"조":"-";};
  const tried=new Set(A.results.map(r=>r.leader_id));
  return `<div class="card stack">

   ===================================================================== */
function fmtDur(ms){if(ms==null)return "-";const s=Math.round(ms/1000);return Math.floor(s/60)+"분 "+pad2(s%60)+"초";}
function fmtLocal(iso){const d=new Date(iso);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function toLocalInput(iso){const d=new Date(iso);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}

async function loadAll(){
  A.loading=true; render();
  A.settings=await api.settings();
  A.applicants=await api.applicants();
  const t=await api.teams(); A.teams=t.teams; A.links=t.links;
  A.results=await api.results();
  A.loading=false; render();
}

document.addEventListener("click",async e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){A.tab=tab.dataset.tab;A.q="";render();return;}
  const lead=e.target.closest("[data-lead]");
  if(lead){const [tid,aid]=lead.dataset.lead.split("|");
    try{await api.setLeader(tid,aid);await loadAll();toast("조장을 변경했습니다.");}catch(err){toast(err.message,"bad");}return;}
  const del=e.target.closest("[data-del]");
  if(del){if(!confirm("이 신청자를 삭제할까요? 되돌릴 수 없습니다."))return;
    try{await api.removeApplicant(del.dataset.del);await loadAll();toast("삭제했습니다.");}catch(err){toast(err.message,"bad");}return;}
  const unl=e.target.closest("[data-unlock]");
  if(unl){try{await api.patchApplicant(unl.dataset.unlock,{submitted:false});await loadAll();toast("제출을 해제했습니다. 본인이 다시 수정할 수 있습니다.");}catch(err){toast(err.message,"bad");}return;}
  const qmv=e.target.closest("[data-qmove]");
  if(qmv){const [i,d]=qmv.dataset.qmove.split("|").map(Number);
    const qs=collectQuestions(); const j=i+d;
    if(j<0||j>=qs.length)return;
    [qs[i],qs[j]]=[qs[j],qs[i]]; A.settings.questions=qs; render(); return;}
  const qdl=e.target.closest("[data-qdel]");
  if(qdl){const qs=collectQuestions(); qs.splice(Number(qdl.dataset.qdel),1); A.settings.questions=qs; render(); return;}

  const btn=e.target.closest("[data-act]"); if(!btn) return;
  const act=btn.dataset.act;
  try{
    if(act==="unlock"){
      if($("#pin").value.trim()!==String(CONFIG.ADMIN_PIN)) return toast("PIN이 올바르지 않습니다.","bad");
      A.ok=true; await loadAll(); return;
    }
    if(act==="reload"){await loadAll();toast("최신 데이터를 불러왔습니다.");}
    else if(act==="csv") downloadCsv();
    else if(act==="build"){
      const size=Number(($("#tsize")||{}).value||A.settings.team_size||4);
      const r=buildTeams(submitted().map(x=>({...x})),size);
      A.plan=r.teams; A.planWarn=r.warnings; A.settings.team_size=size; render();
    }
    else if(act==="drop-plan"){A.plan=null;A.planWarn=[];render();}
    else if(act==="save-plan"){
      if(!A.plan) return;
      if(!confirm("이 편성으로 확정할까요? 기존 조 편성과 게임 기록은 대체됩니다."))return;
      await api.replaceTeams(A.plan);
      await api.saveSettings({team_size:A.settings.team_size});
      A.plan=null;A.planWarn=[]; await loadAll(); toast("조 편성을 확정했습니다.");
    }
    else if(act==="toggle-publish"){
      const next=!A.settings.teams_published;
      await api.saveSettings({teams_published:next}); await loadAll();
      toast(next?"신청자에게 공개했습니다.":"공개를 중단했습니다.");
    }
    else if(act==="qadd"){
      const qs=collectQuestions();
      qs.push({id:"q"+Date.now().toString(36),label:"새 질문",placeholder:"",type:"text"});
      A.settings.questions=qs; render();
    }
    else if(act==="qsave"){
      const qs=collectQuestions();
      if(qs.some(q=>!q.label.trim())) return toast("빈 질문이 있습니다.","bad");
      await api.saveSettings({questions:qs}); await loadAll(); toast("질문을 저장했습니다.");
    }
    else if(act==="reveal-10"||act==="reveal-60"){
      const m=act==="reveal-10"?10:60;
      $("#s-reveal").value=toLocalInput(new Date(Date.now()+m*60000).toISOString());
    }
    else if(act==="reveal-clear"){$("#s-reveal").value="";}
    else if(act==="ssave"){
      const raw=$("#s-reveal").value;
      await api.saveSettings({
        event_title:$("#s-title").value.trim()||"조 편성 & 조원 맞히기",
        reveal_at: raw?new Date(raw).toISOString():null,
        form_open: $("#s-open").value==="1",
        teams_published: $("#s-pub").value==="1",
      });
      await loadAll(); toast("설정을 저장했습니다.");
    }
  }catch(err){toast(err.message||String(err),"bad");}
});

document.addEventListener("change",async e=>{
  const mv=e.target.closest("[data-move]");
  if(mv&&e.target.value){
    const [aid,from]=mv.dataset.move.split("|");
    try{await api.moveMember(aid,from,e.target.value);await loadAll();toast("조를 옮겼습니다.");}
    catch(err){toast(err.message,"bad");}
  }
});

document.addEventListener("input",e=>{
  if(e.target.id==="q"){A.q=e.target.value;render();$("#q").focus();$("#q").setSelectionRange(A.q.length,A.q.length);}
});

document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="pin"){e.preventDefault();$('[data-act="unlock"]').click();}
});

function collectQuestions(){
  const qs=(A.settings.questions||DEFAULT_QUESTIONS).map(q=>({...q}));
  $$("[data-qf]").forEach(el=>{
    const [i,f]=el.dataset.qf.split("|");
    if(qs[Number(i)]) qs[Number(i)][f]=el.value;
  });
  return qs;
}

function downloadCsv(){
  const qs=A.settings.questions||DEFAULT_QUESTIONS;
  const head=["이름","전화뒷자리","출생연도","성별","MBTI","리더성향","제출","제출시각","조",...qs.map(q=>q.label)];
  const teamOf=id=>{const l=A.links.find(l=>l.applicant_id===id);if(!l)return "";
    const t=A.teams.find(t=>t.id===l.team_id);return t?(t.leader_id===id?t.no+"조(조장)":t.no+"조"):"";};
  const rows=A.applicants.map(a=>[a.name,a.phone4,a.birth_year||"",GENDER[a.gender]||"",a.mbti||"",a.leader_score??"",
    a.submitted?"O":"X",a.submitted_at?fmtLocal(a.submitted_at):"",teamOf(a.id),
    ...qs.map(q=>(a.answers||{})[q.id]||"")]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="신청자_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

render();
</script>
</body>
</html>
